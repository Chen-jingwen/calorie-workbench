<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>热量工作台｜完整版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#22c59e',
                        darkCard: '#162c44',
                        softBg: '#f7fafc',
                    },
                    fontFamily: {
                        sans: ['system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .ring-progress {
                transform: rotate(-90deg);
            }
            .tab-active {
                color: #22c59e;
            }
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            }
        }
    </style>
</head>
<body class="bg-softBg min-h-screen pb-20">
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen relative overflow-hidden">
        <!-- 首页视图 -->
        <div id="page-home" class="page px-4 py-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold text-gray-800">我的热量工作台</h1>
                <div class="flex gap-3">
                    <button class="text-gray-500"><i class="fa fa-ellipsis-h"></i></button>
                    <button class="text-gray-500"><i class="fa fa-share-alt"></i></button>
                    <button onclick="saveTodayData()" class="text-primary font-medium">保存</button>
                </div>
            </div>
            <!-- 热量圆环卡片 -->
            <div class="bg-darkCard rounded-2xl p-6 text-white mb-6 card-shadow">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="text-lg opacity-90">今日净摄入</div>
                        <div class="text-5xl font-bold my-2">
                            <span id="netCal">0</span>
                            <span class="text-xl">kcal</span>
                        </div>
                        <div class="text-lg opacity-90">目标摄入 <span id="targetCal">1500</span> kcal</div>
                        <button class="bg-primary rounded-full px-4 py-2 mt-3 text-sm font-medium">
                            能量缺口 <span id="gapCal">0</span> kcal
                        </button>
                    </div>
                    <div class="relative w-32 h-32">
                        <svg class="w-full h-full ring-progress" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="40" fill="none" stroke="#334b66" stroke-width="8"/>
                            <circle id="ringCircle" cx="50" cy="50" r="40" fill="none" stroke="#22c59e" stroke-width="8" stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="251.2"/>
                        </svg>
                    </div>
                </div>
            </div>
            <!-- 三大功能入口 -->
            <div class="grid grid-cols-3 gap-4">
                <div onclick="switchSubPage('addFood')" class="bg-white rounded-xl p-5 card-shadow text-center cursor-pointer">
                    <div class="w-14 h-14 rounded-full bg-teal-50 flex items-center justify-center mx-auto mb-3">
                        <i class="fa fa-list-ul text-primary text-xl"></i>
                    </div>
                    <div class="font-semibold text-gray-800">食物录入</div>
                    <div class="text-sm text-gray-500 mt-2">拍照识别</div>
                    <div class="text-sm text-gray-500">语音输入</div>
                    <div class="text-sm text-gray-500">手动添加</div>
                </div>
                <div onclick="switchSubPage('addSport')" class="bg-white rounded-xl p-5 card-shadow text-center cursor-pointer">
                    <div class="w-14 h-14 rounded-full bg-teal-50 flex items-center justify-center mx-auto mb-3">
                        <i class="fa fa-running text-primary text-xl"></i>
                    </div>
                    <div class="font-semibold text-gray-800">运动录入</div>
                    <div class="text-sm text-gray-500 mt-2">上传运动截图</div>
                </div>
                <div onclick="switchSubPage('targetSet')" class="bg-white rounded-xl p-5 card-shadow text-center cursor-pointer">
                    <div class="w-14 h-14 rounded-full bg-teal-50 flex items-center justify-center mx-auto mb-3">
                        <i class="fa fa-check-circle text-primary text-xl"></i>
                    </div>
                    <div class="font-semibold text-gray-800">目标设置</div>
                    <div class="text-sm text-gray-500 mt-2">录入运动消耗</div>
                </div>
            </div>
        </div>

        <!-- 添加食物子页面 -->
        <div id="sub-addFood" class="sub-page hidden">
            <div class="bg-teal-100 px-4 py-5 flex justify-between items-center">
                <button onclick="backHome()" class="text-gray-800"><i class="fa fa-arrow-left text-lg"></i></button>
                <h2 class="text-xl font-bold">添加食物</h2>
                <div class="flex gap-3">
                    <button class="text-gray-600"><i class="fa fa-ellipsis-h"></i></button>
                    <button class="text-gray-600"><i class="fa fa-share-alt"></i></button>
                    <button onclick="saveFoodItem()" class="text-primary font-medium">保存</button>
                </div>
            </div>
            <div class="p-4">
                <div class="bg-white rounded-xl p-6 card-shadow mb-4">
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center mb-4 relative">
                        <input type="file" id="foodImgInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                        <i class="fa fa-camera text-gray-400 text-3xl"></i>
                        <p class="text-gray-500 mt-2">点击上传食物图片</p>
                        <div id="foodImgPreview" class="mt-3"></div>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="startSpeechRecog()" class="flex-1 border border-gray-300 rounded-lg py-2">语音录入</button>
                        <button onclick="queryAiCal()" class="flex-1 bg-darkCard text-white rounded-lg py-2">AI 查询热量</button>
                    </div>
                </div>
                <div class="bg-teal-50 rounded-xl p-4 mb-4 card-shadow">
                    <div class="flex items-center gap-2 mb-2">
                        <i class="fa fa-microphone text-darkCard"></i>
                        <span class="font-semibold">食物描述</span>
                    </div>
                    <textarea id="foodDesc" class="w-full border rounded-lg p-3 text-sm" placeholder="例如：一杯茉莉奶白，少冰三分糖中杯"></textarea>
                </div>
                <div class="space-y-3 mb-6">
                    <div>
                        <label class="block text-sm font-medium mb-1">食物名称</label>
                        <input id="foodName" type="text" class="w-full border rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">份量/规格</label>
                        <input id="foodUnit" type="text" class="w-full border rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">热量 kcal</label>
                        <input id="foodCal" type="number" class="w-full border rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">食用时间</label>
                        <input id="foodTime" type="datetime-local" class="w-full border rounded-lg p-2">
                    </div>
                </div>
                <button onclick="saveFoodItem()" class="w-full bg-blue-600 text-white rounded-xl py-3 font-medium">保存到今日记录</button>
            </div>
        </div>

        <!-- 运动录入子页面 -->
        <div id="sub-addSport" class="sub-page hidden">
            <div class="bg-white px-4 py-5 flex justify-between items-center">
                <button onclick="backHome()" class="text-gray-800"><i class="fa fa-arrow-left text-lg"></i></button>
                <h2 class="text-xl font-bold">运动录入</h2>
                <div class="flex gap-3">
                    <button class="text-gray-600"><i class="fa fa-ellipsis-h"></i></button>
                    <button class="text-gray-600"><i class="fa fa-share-alt"></i></button>
                    <button onclick="saveSportItem()" class="text-primary font-medium">保存</button>
                </div>
            </div>
            <div class="p-4">
                <div class="bg-blue-500 rounded-xl p-4 text-white flex justify-between items-center mb-4">
                    <div>
                        <p class="text-lg font-medium">上传运动截图</p>
                    </div>
                    <label class="bg-white text-blue-600 px-4 py-2 rounded-lg cursor-pointer">
                        选择图片
                        <input type="file" id="sportImgInput" accept="image/*" class="hidden">
                    </label>
                </div>
                <div class="bg-white rounded-xl p-4 card-shadow mb-4">
                    <div class="grid grid-cols-3 text-center border-b pb-2 mb-2">
                        <div class="text-primary font-medium">运动类型</div>
                        <div>运动时长</div>
                        <div>消耗热量</div>
                    </div>
                    <div id="sportListWrap" class="space-y-2"></div>
                </div>
                <div class="space-y-3 mb-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">运动名称</label>
                        <input id="sportName" type="text" class="w-full border rounded-lg p-2" placeholder="快走、慢跑、跳绳">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">时长（分钟）</label>
                        <input id="sportMin" type="number" class="w-full border rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">消耗热量 kcal</label>
                        <input id="sportCal" type="number" class="w-full border rounded-lg p-2">
                    </div>
                </div>
                <div class="bg-gradient-to-br from-teal-400 to-blue-400 rounded-xl p-5 text-white mb-4 card-shadow">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold">今日汇总</h3>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div>
                            <div class="text-sm opacity-90">今日运动消耗</div>
                            <div class="text-lg font-semibold" id="sumSportCal">0</div>
                        </div>
                        <div>
                            <div class="text-sm opacity-90">食物摄入</div>
                            <div class="text-lg font-semibold" id="sumFoodCal">0</div>
                        </div>
                        <div>
                            <div class="text-sm opacity-90">目标摄入</div>
                            <div class="text-lg font-semibold" id="sumTargetCal">1500</div>
                        </div>
                    </div>
                    <div class="bg-white text-gray-800 rounded-full text-center py-2 mt-3 font-medium">
                        <span id="tipText">暂无数据</span>
                    </div>
                </div>
                <button onclick="saveSportItem()" class="w-full bg-primary text-white rounded-xl py-3 font-medium">添加这条运动</button>
            </div>
        </div>

        <!-- 目标设置子页面 -->
        <div id="sub-targetSet" class="sub-page hidden">
            <div class="bg-white px-4 py-5 flex justify-between items-center">
                <button onclick="backHome()" class="text-gray-800"><i class="fa fa-arrow-left text-lg"></i></button>
                <h2 class="text-xl font-bold">目标设置</h2>
                <div class="flex gap-3">
                    <button class="text-gray-600"><i class="fa fa-ellipsis-h"></i></button>
                    <button class="text-gray-600"><i class="fa fa-share-alt"></i></button>
                    <button onclick="saveTarget()" class="text-primary font-medium">保存</button>
                </div>
            </div>
            <div class="p-4">
                <div class="bg-white rounded-xl p-5 card-shadow">
                    <label class="block mb-2 font-medium">每日目标热量 (kcal)</label>
                    <input id="setTargetCal" type="number" value="1500" class="w-full border rounded-lg p-2">
                    <button onclick="saveTarget()" class="mt-3 w-full bg-primary text-white rounded-lg py-2">保存目标</button>
                </div>
            </div>
        </div>

        <!-- 记录页面 -->
        <div id="page-record" class="page hidden px-4 py-6">
            <h2 class="text-xl font-bold mb-4">记录</h2>
            <div id="recordWrap" class="space-y-3"></div>
        </div>

        <!-- 统计页面 -->
        <div id="page-stat" class="page hidden px-4 py-6">
            <h2 class="text-xl font-bold mb-4">热量统计</h2>
            <div class="bg-white rounded-xl p-4 card-shadow">
                <canvas id="statChart" height="260"></canvas>
            </div>
        </div>

        <!-- 我的（设置页） -->
        <div id="page-mine" class="page hidden px-4 py-6">
            <h2 class="text-xl font-bold mb-4">我的</h2>
            <div class="bg-white rounded-xl p-5 card-shadow space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">每日目标摄入热量(kcal)</label>
                    <input id="mineTarget" type="number" class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">火山方舟 ARK Key</label>
                    <input id="arkKey" type="text" class="w-full border rounded-lg p-2" placeholder="填入你的火山方舟密钥">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">火山方舟 Model</label>
                    <input id="arkModel" type="text" class="w-full border rounded-lg p-2" placeholder="例如 doubao-vision-pro">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">代理地址（解决跨域，必填）</label>
                    <input id="proxyUrl" type="text" class="w-full border rounded-lg p-2" placeholder="http://xxx/proxy">
                </div>
                <div class="flex gap-3">
                    <button onclick="exportData()" class="flex-1 border rounded-lg py-2">导出备份</button>
                    <label class="flex-1 border rounded-lg py-2 text-center cursor-pointer">
                        导入备份
                        <input type="file" id="importFile" accept="application/json" class="hidden">
                    </label>
                </div>
                <button onclick="saveAllSetting()" class="w-full bg-primary text-white rounded-lg py-2">保存设置</button>
                <button onclick="clearAllData()" class="w-full bg-red-400 text-white rounded-lg py-2">清空全部记录</button>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 max-w-md mx-auto">
            <div class="grid grid-cols-4 py-2">
                <div onclick="switchTab('home')" class="tab-item text-center py-2 tab-active">
                    <i class="fa fa-home text-xl"></i>
                    <div class="text-xs mt-1">首页</div>
                </div>
                <div onclick="switchTab('record')" class="tab-item text-center py-2 text-gray-500">
                    <i class="fa fa-list-check text-xl"></i>
                    <div class="text-xs mt-1">记录</div>
                </div>
                <div onclick="switchTab('stat')" class="tab-item text-center py-2 text-gray-500">
                    <i class="fa fa-bar-chart text-xl"></i>
                    <div class="text-xs mt-1">统计</div>
                </div>
                <div onclick="switchTab('mine')" class="tab-item text-center py-2 text-gray-500">
                    <i class="fa fa-user text-xl"></i>
                    <div class="text-xs mt-1">我的</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局数据
        let appData = JSON.parse(localStorage.getItem('calAppData')) || {
            targetCal: 1500,
            arkKey: '',
            arkModel: 'doubao-vision-pro',
            proxyUrl: '',
            foodList: [],
            sportList: [],
            history: []
        };
        let speechRec = null;
        let chartInstance = null;
        const todayStr = new Date().toISOString().split('T')[0];

        // 初始化加载
        function init() {
            document.getElementById('mineTarget').value = appData.targetCal;
            document.getElementById('setTargetCal').value = appData.targetCal;
            document.getElementById('arkKey').value = appData.arkKey;
            document.getElementById('arkModel').value = appData.arkModel;
            document.getElementById('proxyUrl').value = appData.proxyUrl;
            document.getElementById('foodTime').value = new Date().toISOString().slice(0, 16);
            bindFileEvents();
            refreshAll();
        }

        // 绑定图片上传预览
        function bindFileEvents() {
            const foodImg = document.getElementById('foodImgInput');
            foodImg.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    document.getElementById('foodImgPreview').innerHTML = `<img src="${ev.target.result}" class="max-h-32 rounded-lg">`;
                }
                reader.readAsDataURL(file);
            }
            const sportImg = document.getElementById('sportImgInput');
            sportImg.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    alert("运动截图已加载，后续 AI 识别会读取这张图");
                }
                reader.readAsDataURL(file);
            }
            // 导入备份文件
            document.getElementById('importFile').onchange = function(e) {
                const f = e.target.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = function(ev) {
                    try {
                        appData = JSON.parse(ev.target.result);
                        saveLocal();
                        init();
                        alert("导入成功");
                    } catch(err) {
                        alert("备份文件格式错误");
                    }
                }
                r.readAsText(f);
            }
        }

        // 保存本地存储
        function saveLocal() {
            localStorage.setItem('calAppData', JSON.stringify(appData));
        }

        // 页面切换
        function switchTab(tabName) {
            document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
            document.querySelectorAll('.sub-page').forEach(p=>p.classList.add('hidden'));
            document.getElementById('page-'+tabName).classList.remove('hidden');
            document.querySelectorAll('.tab-item').forEach(item=>{
                item.classList.remove('tab-active');
                item.classList.add('text-gray-500');
            })
            event.currentTarget.classList.add('tab-active');
            event.currentTarget.classList.remove('text-gray-500');
            if(tabName === 'stat') renderChart();
            if(tabName === 'record') renderRecord();
        }

        function switchSubPage(subName) {
            document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
            document.querySelectorAll('.sub-page').forEach(p=>p.classList.add('hidden'));
            document.getElementById('sub-'+subName).classList.remove('hidden');
        }

        function backHome() {
            document.querySelectorAll('.sub-page').forEach(p=>p.classList.add('hidden'));
            document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
            document.getElementById('page-home').classList.remove('hidden');
            document.querySelectorAll('.tab-item').forEach(item=>{
                item.classList.remove('tab-active');
                item.classList.add('text-gray-500');
            })
            document.querySelector('.tab-item').classList.add('tab-active');
            document.querySelector('.tab-item').classList.remove('text-gray-500');
            refreshAll();
        }

        // 语音识别
        function startSpeechRecog() {
            if (!('webkitSpeechRecognition' in window)) {
                alert("当前浏览器不支持语音识别，请使用 Chrome / Edge");
                return;
            }
            if (speechRec) speechRec.stop();
            speechRec = new webkitSpeechRecognition();
            speechRec.continuous = false;
            speechRec.interimResults = false;
            speechRec.lang = 'zh-CN';
            speechRec.onresult = function(e) {
                const text = e.results[0][0].transcript;
                document.getElementById('foodDesc').value = text;
                alert("语音识别完成：" + text);
            }
            speechRec.onerror = () => alert("语音识别出错");
            speechRec.start();
        }

        // 【火山方舟 AI 调用】
        // 说明：原生浏览器直接请求方舟接口会跨域，必须配置 proxyUrl 代理转发
        async function queryAiCal() {
            const key = appData.arkKey;
            const model = appData.arkModel;
            const proxy = appData.proxyUrl;
            const desc = document.getElementById('foodDesc').value.trim();
            if (!key || !proxy) {
                alert("请先在【我的】页面填写火山方舟 Key 和代理地址！");
                return;
            }
            if (!desc) {
                alert("请先填写食物描述");
                return;
            }
            const prompt = `你是热量计算器，根据食物描述，返回 JSON，只返回：{"name":"","cal":数字,"unit":"一份"}，不要多余文字。食物：${desc}`;
            const payload = {
                model: model,
                messages: [{role:"user", content: prompt}]
            }
            try {
                const res = await fetch(proxy, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                })
                const raw = await res.json();
                if (raw.choices && raw.choices.length > 0) {
                    let ans = raw.choices[0].message.content;
                    ans = ans.replace(/```json|```/g, '').trim();
                    const obj = JSON.parse(ans);
                    document.getElementById('foodName').value = obj.name || '';
                    document.getElementById('foodCal').value = Number(obj.cal) || 0;
                    document.getElementById('foodUnit').value = obj.unit || '份';
                    alert("AI 解析完成！");
                } else {
                    alert("AI 返回异常");
                }
            } catch (err) {
                console.error(err);
                alert("请求失败：检查代理地址、Key 是否正确，跨域问题一般由代理处理");
            }
        }

        // 保存食物条目
        function saveFoodItem() {
            const item = {
                id: Date.now(),
                name: document.getElementById('foodName').value.trim(),
                unit: document.getElementById('foodUnit').value.trim(),
                cal: Number(document.getElementById('foodCal').value || 0),
                time: document.getElementById('foodTime').value,
                type: "food",
                date: todayStr
            }
            if (!item.name) {
                alert("食物名称不能为空");
                return;
            }
            appData.foodList.push(item);
            saveLocal();
            refreshAll();
            alert("食物记录保存成功");
        }

        // 保存运动条目
        function saveSportItem() {
            const item = {
                id: Date.now(),
                name: document.getElementById('sportName').value.trim(),
                min: Number(document.getElementById('sportMin').value || 0),
                cal: Number(document.getElementById('sportCal').value || 0),
                type: "sport",
                date: todayStr
            }
            if (!item.name) {
                alert("运动名称不能为空");
                return;
            }
            appData.sportList.push(item);
            saveLocal();
            refreshAll();
            renderSportList();
            alert("运动记录保存成功");
        }

        // 删除单条记录
        function delRecord(id, type) {
            if (confirm("确定删除这条记录？")) {
                if (type === 'food') appData.foodList = appData.foodList.filter(i => i.id !== id);
                if (type === 'sport') appData.sportList = appData.sportList.filter(i => i.id !== id);
                saveLocal();
                refreshAll();
                renderRecord();
            }
        }

        // 保存目标
        function saveTarget() {
            appData.targetCal = Number(document.getElementById('setTargetCal').value || 1500);
            saveLocal();
            refreshAll();
            alert("目标已保存");
        }

        // 保存全部设置
        function saveAllSetting() {
            appData.targetCal = Number(document.getElementById('mineTarget').value || 1500);
            appData.arkKey = document.getElementById('arkKey').value.trim();
            appData.arkModel = document.getElementById('arkModel').value.trim();
            appData.proxyUrl = document.getElementById('proxyUrl').value.trim();
            saveLocal();
            refreshAll();
            alert("设置保存成功");
        }

        // 导出备份
        function exportData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `热量记录备份_${todayStr}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 清空全部数据
        function clearAllData() {
            if (!confirm("确认清空所有记录？无法恢复！")) return;
            appData = {
                targetCal: 1500,
                arkKey: '',
                arkModel: 'doubao-vision-pro',
                proxyUrl: '',
                foodList: [],
                sportList: [],
                history: []
            };
            saveLocal();
            init();
            alert("已清空");
        }

        // 计算汇总、刷新首页、圆环
        function refreshAll() {
            const todayFood = appData.foodList.filter(f => f.date === todayStr);
            const todaySport = appData.sportList.filter(s => s.date === todayStr);
            const sumFood = todayFood.reduce((a, b) => a + b.cal, 0);
            const sumSport = todaySport.reduce((a, b) => a + b.cal, 0);
            const net = sumFood - sumSport;
            const target = appData.targetCal;
            const gap = target - net;

            document.getElementById('netCal').innerText = net;
            document.getElementById('targetCal').innerText = target;
            document.getElementById('gapCal').innerText = gap;
            document.getElementById('sumFoodCal').innerText = sumFood;
            document.getElementById('sumSportCal').innerText = sumSport;
            document.getElementById('sumTargetCal').innerText = target;

            // 圆环进度
            const percent = Math.min(net / target, 1);
            const circle = document.getElementById('ringCircle');
            const full = 251.2;
            circle.style.strokeDashoffset = full * (1 - percent);

            // 提示文字
            const tip = document.getElementById('tipText');
            if (net > target) {
                tip.innerText = `今日超出 ${net - target} kcal`;
            } else {
                tip.innerText = `还剩 ${gap} kcal 额度`;
            }
            renderSportList();
        }

        // 渲染运动列表
        function renderSportList() {
            const todaySport = appData.sportList.filter(s => s.date === todayStr);
            const wrap = document.getElementById('sportListWrap');
            wrap.innerHTML = '';
            todaySport.forEach(item => {
                wrap.innerHTML += `
                <div class="grid grid-cols-3 text-center py-2 border-b">
                    <div>${item.name}</div>
                    <div>${item.min} 分钟</div>
                    <div>${item.cal} kcal</div>
                </div>
                `
            })
        }

        // 渲染全部记录页面
        function renderRecord() {
            const wrap = document.getElementById('recordWrap');
            wrap.innerHTML = '';
            const all = [...appData.foodList.map(i=>({...i, typeName:"食物"})), ...appData.sportList.map(i=>({...i, typeName:"运动"}))];
            all.sort((a,b)=>b.id - a.id);
            all.forEach(item => {
                wrap.innerHTML += `
                <div class="bg-white rounded-xl p-4 card-shadow flex justify-between items-center">
                    <div>
                        <div class="font-semibold">${item.name}</div>
                        <div class="text-sm text-gray-500">${item.typeName} · ${item.cal} kcal · ${item.date}</div>
                    </div>
                    <button onclick="delRecord(${item.id}, '${item.type}')" class="text-red-400"><i class="fa fa-trash"></i></button>
                </div>
                `
            })
            if (all.length === 0) wrap.innerHTML = `<div class="text-gray-400 text-center py-6">暂无记录</div>`;
        }

        // 统计图表（近7天简易趋势）
        function renderChart() {
            const ctx = document.getElementById('statChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            const labels = [];
            const foodData = [];
            const sportData = [];
            for(let i=6;i>=0;i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const ds = d.toISOString().split('T')[0];
                labels.push(ds.slice(5));
                const fd = appData.foodList.filter(f=>f.date === ds).reduce((a,b)=>a+b.cal,0);
                const sd = appData.sportList.filter(s=>s.date === ds).reduce((a,b)=>a+b.cal,0);
                foodData.push(fd);
                sportData.push(sd);
            }
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        {label:"摄入热量", data:foodData, backgroundColor:"#22c59e"},
                        {label:"消耗热量", data:sportData, backgroundColor:"#334b66"}
                    ]
                },
                options: {responsive:true, maintainAspectRatio:false}
            })
        }

        // 首页保存按钮
        function saveTodayData() {
            saveLocal();
            alert("今日数据已保存");
        }

        init();
    </script>
</body>
</html>
