<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物热量计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 24px;
            font-size: 22px;
        }
        .setting-block {
            background: #f0f4ff;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .setting-block h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }
        .form-item {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d8dee9;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }
        button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        button.secondary {
            background: #6b7280;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 30px 10px;
            text-align: center;
            cursor: pointer;
            margin: 16px 0;
        }
        .upload-area:hover {
            border-color: #2563eb;
        }
        #preview-img {
            max-width: 100%;
            max-height: 300px;
            margin-top: 12px;
            border-radius: 8px;
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            min-height: 80px;
            white-space: pre-wrap;
        }
        .tip {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍱 食物热量 AI 估算器</h1>
        <div class="setting-block">
            <h3>🔧 模型设置（填入你的方舟信息）</h3>
            <div class="form-item">
                <label>ARK API Key</label>
                <input id="apiKey" placeholder="ark-xxx">
            </div>
            <div class="form-item">
                <label>模型 ID</label>
                <input id="modelId" placeholder="doubao-seed-2-1-pro-q">
            </div>
            <button id="saveSetting">保存设置</button>
            <div class="tip">密钥保存在浏览器本地，不会上传其他服务器</div>
        </div>q

        <div class="form-item">
            <label>文字描述食物（例如：茉莉奶白少冰三分糖中杯）</label>
            <textarea id="foodText" rows="3" placeholder="输入食物名称"></textarea>
        </div>
        <button id="askTextBtn">AI 查询热量</button>

        <div class="upload-area" id="uploadBox">
            <p>点击上传食物图片（识别图片热量）</p >
            <input type="file" id="fileInput" accept="image/*" hidden>
            < img id="preview-img" />
        </div>
        <button id="askImgBtn" disabled>识别图片食物热量</button>

        <div class="result-box" id="resultBox">结果会展示在这里</div>
    </div>

    <script>
        const API_KEY_INPUT = document.getElementById('apiKey');
        const MODEL_ID_INPUT = document.getElementById('modelId');
        const SAVE_BTN = document.getElementById('saveSetting');
        const FOOD_TEXT = document.getElementById('foodText');
        const ASK_TEXT_BTN = document.getElementById('askTextBtn');
        const UPLOAD_BOX = document.getElementById('uploadBox');
        const FILE_INPUT = document.getElementById('fileInput');
        const PREVIEW_IMG = document.getElementById('preview-img');
        const ASK_IMG_BTN = document.getElementById('askImgBtn');
        const RESULT_BOX = document.getElementById('resultBox');

        let savedKey = localStorage.getItem('arkApiKey') || '';
        let savedModel = localStorage.getItem('arkModelId') || 'doubao-seed-2-1-pro-260915';
        let selectedImageBase64 = null;

        API_KEY_INPUT.value = savedKey;
        MODEL_ID_INPUT.value = savedModel;

        SAVE_BTN.onclick = () => {
            localStorage.setItem('arkApiKey', API_KEY_INPUT.value.trim());
            localStorage.setItem('arkModelId', MODEL_ID_INPUT.value.trim());
            alert('✅ 设置已保存');
        }

        UPLOAD_BOX.onclick = () => FILE_INPUT.click();
        FILE_INPUT.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                selectedImageBase64 = ev.target.result;
                PREVIEW_IMG.src = selectedImageBase64;
                ASK_IMG_BTN.disabled = false;
            }
            reader.readAsDataURL(file);
        }

        async function callArkApi(content) {
            const key = localStorage.getItem('arkApiKey');
            const model = localStorage.getItem('arkModelId');
            if (!key || !model) {
                return '❌ 请先填写并保存 ARK API Key 和模型 ID';
            }
            const resp = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        {
                            role: 'user',
                            content: content
                        }
                    ]
                })
            })
            const data = await resp.json();
            if (data.error) {
                return `❌ 接口报错：${JSON.stringify(data.error)}`;
            }
            return data.choices?.[0]?.message?.content || '无返回内容';
        }

        ASK_TEXT_BTN.onclick = async () => {
            const text = FOOD_TEXT.value.trim();
            if (!text) {
                RESULT_BOX.textContent = '请输入食物描述';
                return;
            }
            RESULT_BOX.textContent = '正在请求...';
            const prompt = `你是专业营养师，估算这份食物的热量，给出热量 kcal、大致营养（碳水/蛋白/脂肪），简短清晰：${text}`;
            const res = await callArkApi(prompt);
            RESULT_BOX.textContent = res;
        }

        ASK_IMG_BTN.onclick = async () => {
            if (!selectedImageBase64) return;
            RESULT_BOX.textContent = '正在识别图片...';
            const base64 = selectedImageBase64.split(',')[1];
            const content = [
                {
                    type: 'text',
                    text: '识别图里的食物，估算热量，给出 kcal、碳水、蛋白、脂肪，简短清晰'
                },
                {
                    type: 'image_url',
                    image_url: {
                        url: `data:image/jpeg;base64,${base64}`
                    }
                }
            ]
            const res = await callArkApi(content);
            RESULT_BOX.textContent = res;
        }
    </script>
</body>
</html>
